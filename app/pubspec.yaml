name: app
description: "UniMatch Gasabo — Android client"
publish_to: 'none'
# Bump on every build you hand out: the +N build number must increase or
# Android refuses to install the APK over an existing one, and without it
# nobody can tell which build a phone is actually running.
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
