org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled: on Windows its cache files
# (caches-jvm/**/*.tab) get locked mid-build -- by Defender's realtime scan or
# any indexer touching app/build -- and the task dies with "Could not close
# incremental caches". Release builds compile everything from scratch anyway,
# so incremental buys nothing here and only adds a failure mode.
kotlin.incremental=false
